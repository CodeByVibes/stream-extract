name: Linux Release Packaging

on:
  push:
    branches:
      - main

jobs:
  build-and-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd binutils

      - name: Run native tools fetch script
        run: |
          chmod +x build/linux/fetch-native-tools.sh
          ./build/linux/fetch-native-tools.sh

      - name: Run smoke tests
        run: |
          chmod +x build/linux/smoke-test.sh
          ./build/linux/smoke-test.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamextract-linux-x64
          path: /tmp/streamextract-linux-x64.tar.gz
