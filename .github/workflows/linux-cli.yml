name: Linux CLI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      SMOKE_FIXTURES: |
        /tmp/streamextract-fixtures/sample.mp4
        /tmp/streamextract-fixtures/sample.mkv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes binutils curl squashfs-tools tar zstd
      - name: Validate and package
        run: build/linux/fetch-native-tools.sh
      - name: Smoke test
        run: |
          build/linux/generate-fixtures.sh
          build/linux/smoke-test.sh
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: streamextract-linux-x64
          path: /tmp/streamextract-linux-x64.tar.gz
      - name: Upload release asset
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: /tmp/streamextract-linux-x64.tar.gz
